<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper TALON 🦅</title>
    <script src="https://unpkg.com/@farcaster/frame-sdk/dist/index.js"></script>
    <style>
        :root { --bg: #0f172a; --accent: #3b82f6; --cell: #1e293b; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: var(--accent); font-weight: 900; }
        #status { margin-bottom: 15px; font-weight: bold; font-size: 0.9rem; }
        #grid { display: grid; grid-template-columns: repeat(8, 35px); gap: 4px; padding: 10px; background: #334155; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .cell { width: 35px; height: 35px; background: var(--cell); display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .cell:active { transform: scale(0.9); }
        .revealed { background: #475569; cursor: default; }
        .mine { background: #ef4444 !important; }
        .controls { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; width: 80%; max-width: 280px; }
        button { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
        .btn-pay { background: #f59e0b; color: #000; }
        .btn-share { background: #10b981; color: white; display: none; }
        .btn-reset { background: #475569; color: white; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>🦅 TALON MINES</h1>
    <div id="status">Évitez les mines pour la TALON Nation !</div>
    
    <div id="grid"></div>

    <div class="controls">
        <button class="btn-pay" onclick="payForHint()">💡 Indice (1 $TALON)</button>
        <button id="shareBtn" class="btn-share" onclick="shareWin()">📢 Partager mon Score</button>
        <button class="btn-reset" onclick="newGame()">Nouvelle Partie</button>
    </div>

    <script>
        const ROWS = 8, COLS = 8, MINES = 10;
        let grid = [], revealedCount = 0, gameOver = false;

        function newGame() {
            gameOver = false; revealedCount = 0;
            document.getElementById('grid').innerHTML = '';
            document.getElementById('status').innerText = "Bonne chance, Pilot !";
            document.getElementById('status').style.color = "white";
            document.getElementById('shareBtn').style.display = 'none';
            generateGrid();
        }

        function generateGrid() {
            grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            let planted = 0;
            while (planted < MINES) {
                let r = Math.floor(Math.random() * ROWS), c = Math.floor(Math.random() * COLS);
                if (grid[r][c] !== 'M') { grid[r][c] = 'M'; planted++; }
            }
            const gridEl = document.getElementById('grid');
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.onclick = () => reveal(r, c, cell);
                    gridEl.appendChild(cell);
                }
            }
        }

        function reveal(r, c, el) {
            if (gameOver || el.classList.contains('revealed')) return;
            if (grid[r][c] === 'M') {
                el.classList.add('mine'); el.innerText = '💣';
                document.getElementById('status').innerText = "BOOM ! Game Over.";
                document.getElementById('status').style.color = "#ef4444";
                gameOver = true;
            } else {
                let count = 0;
                for(let i=-1; i<=1; i++) for(let j=-1; j<=1; j++) if(grid[r+i]?.[c+j] === 'M') count++;
                el.classList.add('revealed'); el.innerText = count || '';
                revealedCount++;
                if (revealedCount === (ROWS * COLS) - MINES) {
                    document.getElementById('status').innerText = "GAGNÉ ! 🏆";
                    document.getElementById('status').style.color = "#10b981";
                    document.getElementById('shareBtn').style.display = 'block';
                    gameOver = true;
                }
            }
        }

        async function payForHint() {
            try {
                if (window.farcaster && window.farcaster.sdk) {
                    // Transaction sur le réseau BASE vers ton adresse Primary
                    await window.farcaster.sdk.actions.eth_sendTransaction({
                        params: { 
                            to: "0x872b8348dF29fE38D331CBe9048a60424578fA83", 
                            value: "10000000000000000" // Équivalent d'une petite unité sur Base
                        } 
                    });
                    alert("Indice de Pilot : Concentrez-vous sur les coins, ils sont souvent sûrs au début !");
                } else {
                    alert("Mode Test : Le paiement de 1 $TALON sera activé sur Farcaster.");
                }
            } catch (e) { console.error(e); }
        }

        function shareWin() {
            const shareUrl = `https://warpcast.com/~/compose?text=J'ai survécu au TALON Mines ! 🦅💣 Viens défier le sort :&embeds[]=${window.location.href}`;
            if (window.farcaster && window.farcaster.sdk) {
                window.farcaster.sdk.actions.openUrl(shareUrl);
            } else {
                window.open(shareUrl, '_blank');
            }
        }

        async function init() {
            try {
                if (window.farcaster && window.farcaster.sdk) {
                    await window.farcaster.sdk.actions.ready();
                }
            } catch (e) { console.log("Mode test hors-Farcaster"); }
            newGame();
        }

        init();
    </script>
</body>
</html>
